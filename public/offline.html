<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">

        <title>Offline · Charger log</title>

        <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)">
        <meta name="theme-color" content="#09090b" media="(prefers-color-scheme: dark)">

        <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">

        <!--
            Deliberately self-contained: this page is precached at install time,
            so it must not depend on hashed asset URLs that change on deploy.
        -->
        <style>
            :root {
                color-scheme: light dark;

                --ground: #fafafa;
                --panel: #ffffff;
                --border: #e4e4e7;
                --text: #18181b;
                --muted: #71717a;
                --button: #18181b;
                --button-text: #ffffff;
            }

            @media (prefers-color-scheme: dark) {
                :root {
                    --ground: #09090b;
                    --panel: #18181b;
                    --border: #27272a;
                    --text: #f4f4f5;
                    --muted: #a1a1aa;
                    --button: #ffffff;
                    --button-text: #18181b;
                }
            }

            * {
                box-sizing: border-box;
            }

            body {
                display: flex;
                min-height: 100vh;
                align-items: center;
                justify-content: center;
                margin: 0;
                padding: 1rem;
                background: var(--ground);
                color: var(--text);
                font-family: 'Instrument Sans', ui-sans-serif, system-ui, sans-serif;
                -webkit-font-smoothing: antialiased;
            }

            main {
                width: 100%;
                max-width: 24rem;
                padding: 2rem;
                border: 1px solid var(--border);
                border-radius: 0.75rem;
                background: var(--panel);
                text-align: center;
            }

            .mark {
                font-size: 2rem;
                line-height: 1;
            }

            h1 {
                margin: 1rem 0 0;
                font-size: 1.25rem;
                font-weight: 600;
            }

            p {
                margin: 0.5rem 0 0;
                color: var(--muted);
                font-size: 0.875rem;
                line-height: 1.5;
            }

            button {
                margin-top: 1.5rem;
                padding: 0.5rem 1rem;
                border: 0;
                border-radius: 0.5rem;
                background: var(--button);
                color: var(--button-text);
                font: inherit;
                font-size: 0.875rem;
                font-weight: 500;
                cursor: pointer;
            }

            button:hover {
                opacity: 0.85;
            }
        </style>
    </head>
    <body>
        <main>
            <span class="mark" aria-hidden="true">⚡</span>

            <h1>You're offline</h1>

            <p>The charger log needs a connection to load. Anything you already saved is safe on the server.</p>

            <button type="button" onclick="location.reload()">Try again</button>
        </main>
    </body>
</html>
